LIB_PHPASS="phpass"
LIB_PHPASS_XML_DESCRIPTION="phpass는 PHP 애플리케이션에서 사용하는 이식 가능한 비밀번호 해싱 프레임워크입니다. phpass가 지원하는 가장 권장되는(가장 안전한) 해싱 방법은 OpenBSD 방식의 bcrypt(PHP에서는 CRYPT_BLOWFISH)이며, BSDI 방식의 확장 DES 기반 해시(PHP에서는 CRYPT_EXT_DES)로 대체할 수 있고, 최후의 수단으로 phpass 자체에 구현된 MD5 기반 가변 반복 횟수 비밀번호 해싱 방법으로 대체합니다."
