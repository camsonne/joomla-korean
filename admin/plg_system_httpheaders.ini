PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER_VALUE="HTTP 헤더 값"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP' target='_blank' rel='noopener noreferrer'>콘텐츠 보안 정책(CSP)</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="클라이언트"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="CSP 클릭재킹 보호 frame-ancestors를 사용 설정하고 출처 'self'만 허용합니다. 'self' 이외의 출처를 허용하려면 아래 양식을 사용하세요."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce' target='_blank' rel='noopener noreferrer'>Nonce</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Joomla API를 사용하는 모든 스크립트와 스타일에 대해 암호화 nonce(한 번만 사용하는 숫자)를 사용하여 특정 인라인 스크립트의 허용 목록을 사용 설정합니다. nonce를 지정하면 최신 브라우저는 'unsafe-inline'을 무시하며, nonce를 지원하지 않는 오래된 브라우저를 위해 'unsafe-inline'은 계속 설정해 두어야 합니다."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="'Content-Security-Policy' 대신 'Content-Security-Policy-Report-Only' 헤더를 사용합니다."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="보고 전용"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="strict-dynamic 소스 표현식은 마크업에 있는 스크립트에 nonce나 해시를 함께 지정하여 명시적으로 부여한 신뢰가 해당 루트 스크립트가 불러오는 모든 스크립트로 전파되도록 지정합니다. 동시에 'self'나 'unsafe-inline' 같은 허용 또는 소스 표현식은 무시됩니다."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src' target='_blank' rel='noopener noreferrer'>스크립트 해시</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Joomla API를 사용하는 모든 스크립트에 대해 암호화 해시를 사용하는 선택적 해시 기반 인라인 스크립트 허용 목록을 사용 설정합니다. 해시를 지정하면 최신 브라우저는 'unsafe-inline'을 무시하며, 해시를 지원하지 않는 오래된 브라우저를 위해 'unsafe-inline'은 계속 설정해 두어야 합니다."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src' target='_blank' rel='noopener noreferrer'>스타일 해시</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Joomla API를 사용하는 모든 스타일에 대해 암호화 해시를 사용하는 선택적 해시 기반 인라인 스타일 허용 목록을 사용 설정합니다. 해시를 지정하면 최신 브라우저는 'unsafe-inline'을 무시하며, 해시를 지원하지 않는 오래된 브라우저를 위해 'unsafe-inline'은 계속 설정해 두어야 합니다."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="지시문 추가"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="정책 지시문"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="값"
PLG_SYSTEM_HTTPHEADERS_COOP="Cross-Origin-Opener-Policy"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT="클라이언트"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="둘 다"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security' target='_blank' rel='noopener noreferrer'>HTTP Strict Transport Security(HSTS)</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="max-age"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="이 옵션은 초 단위로 지정하는 'max-age' 시간을 설정합니다. 기본값은 31536000이며 1년에 해당합니다"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href='https://hstspreload.org' target='_blank' rel='noopener noreferrer'>Preload</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="이 옵션은 브라우저 프리로드 목록에 포함되기 위한 옵트인을 활성화합니다."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="중요"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="HSTS는 도메인을 더 이상 HTTPS 없이 호출할 수 없음을 의미합니다. 프리로드 목록에 추가되면 되돌리기 쉽지 않습니다. 도메인을 제거할 수는 있지만 브라우저 업데이트로 사용자에게 변경이 반영되는 데 몇 달이 걸립니다.<br><strong>이 옵션은 '중간자 공격'을 막는 데 매우 중요하므로 반드시 사용 설정해야 하지만, 도메인과 모든 하위 도메인에서 장기적으로 HTTPS가 지원된다고 확신하는 경우에만 사용 설정하세요! 등록하려면 'max-age' 값을 63072000(2년)으로 설정해야 합니다.</strong>"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="하위 도메인도 포함"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="HSTS는 <strong>하위 도메인</strong>에도 사용 설정해야 합니다. 보통 SSL 인증서를 만들 때 하위 도메인 'www'가 고려됩니다. 다른 하위 도메인을 사용한다면 그 도메인에도 유효한 SSL 인증서가 제공되는지 확인하세요."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="기본 보안 헤더 사용"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Joomla는 http 보안 헤더를 처리하는 데 도움이 되는 기본 제공 도구 모음을 제공합니다. 이 헤더는 브라우저가 웹사이트를 <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a>와 <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>클릭재킹</a> 공격으로부터 보호하는 데 도움이 됩니다.</p><p>자세한 내용은 <a href='https://guide.joomla.org/user-manual/security/security-http-headers' target='_blank' rel='noopener noreferrer'>Joomla 문서의 HTTP 헤더 관리 튜토리얼</a>에서 확인할 수 있습니다.</p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="HTTP 보안 헤더"
PLG_SYSTEM_HTTPHEADERS_REFERRERPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy' target='_blank' rel='noopener noreferrer'>Referrer-Policy</a>"
PLG_SYSTEM_HTTPHEADERS_XFRAMEOPTIONS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options' target='_blank' rel='noopener noreferrer'>X-Frame-Options</a>"
PLG_SYSTEM_HTTPHEADERS_XML_DESCRIPTION="이 플러그인으로 HTTP 보안 헤더를 설정할 수 있습니다"
