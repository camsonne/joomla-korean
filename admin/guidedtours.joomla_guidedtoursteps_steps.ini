COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_COUNTER_TITLE="단계 카운터 번호 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_COUNTER_DESCRIPTION="번호를 선택하여 단계를 추가하세요. 번호는 지금까지 투어에 만들어진 단계 수를 나타냅니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_NEW_TITLE="'새로 만들기' 버튼 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_NEW_DESCRIPTION="'새로 만들기'를 선택하여 새 단계를 만드세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TITLE_TITLE="단계 제목 추가"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TITLE_DESCRIPTION="단계의 필수 제목을 입력하세요. 보통 사용자가 실행해야 하는 작업입니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_DESCRIPTION_TITLE="단계 설명 추가"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_DESCRIPTION_DESCRIPTION="내용에는 사용자에게 단계에 대한 설명이 들어가야 합니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_STATUS_TITLE="상태 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_STATUS_DESCRIPTION="단계의 게시 상태를 선택하세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_TITLE="위치 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_DESCRIPTION="페이지에서 대상으로 지정한 요소를 기준으로 한 팝업의 위치입니다. 특정 대상이 없을 때는 '가운데'를 사용합니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TARGET_TITLE="대상 요소 입력"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TARGET_DESCRIPTION="이 단계가 대상으로 하는 페이지의 요소입니다. 요소를 지정하는 CSS 구문을 사용합니다.<br>예를 들어 <code>#jform_title</code>은(는) id가 'jform_title'인 요소를 대상으로 합니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_TITLE="유형 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_DESCRIPTION="만들려는 단계의 종류입니다. '다음'은 상호 작용 없이 투어를 계속하게 하고, '리디렉션'은 다른 페이지로 이동하며, '상호 작용'은 사용자 입력을 요청합니다."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_SAVECLOSE_TITLE="'저장 후 닫기' 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_SAVECLOSE_DESCRIPTION="단계를 저장하고 닫으세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_CONGRATULATIONS_TITLE="축하합니다!"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_CONGRATULATIONS_DESCRIPTION="가이드 투어의 단계를 만들었습니다."
