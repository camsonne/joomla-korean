PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="사이트 사용자가 YubiKey 보안 하드웨어 토큰으로 다단계 인증을 사용할 수 있게 합니다. 사용자는 <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>에서 구할 수 있는 자신의 YubiKey가 필요합니다. 다단계 인증을 사용하려면 사용자 프로필을 편집하여 다단계 인증을 사용 설정해야 합니다."
