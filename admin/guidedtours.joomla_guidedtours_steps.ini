COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_TITLE="'새로 만들기' 버튼 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_DESCRIPTION="'새로 만들기'를 선택하여 새 투어를 만드세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_TITLE="투어 제목 추가"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_DESCRIPTION="투어의 필수 제목을 입력하세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_TITLE="콘텐츠 추가"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_DESCRIPTION="투어를 설명하는 내용을 입력하세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_TITLE="컴포넌트 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_DESCRIPTION="실행 가능한 투어 목록에서 투어를 우선 표시할 확장 프로그램을 선택하세요. 예를 들어 '사용자' 확장 프로그램용 투어를 만든다면 '사용자'를 선택하세요. 모든 페이지에 투어가 표시되게 하려면 '전체'를 선택하세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_TITLE="URL 추가"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_DESCRIPTION="투어를 시작할 페이지의 상대 URL을 추가하세요. 예를 들어 사용자 페이지에서 투어를 시작하려면 <em>administrator/index.php?option=com_users&view=users</em>를 입력하세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_TITLE="'자동 시작' 전환"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_DESCRIPTION="<p>'자동 시작'을 '예'로 설정하면 관련 조건이 충족되는 즉시 투어가 자동으로 시작됩니다.</p><p>같은 조건에서 여러 투어가 자동 시작으로 설정된 경우 목록의 첫 번째 투어만 취소, 완료 또는 건너뛰기 전까지 시작됩니다.</p>"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_TITLE="'저장 후 닫기' 선택"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_DESCRIPTION="투어를 저장하고 닫으세요."
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_TITLE="축하합니다!"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_DESCRIPTION="가이드 투어를 만들었습니다. 이제 투어의 단계를 만들어야 합니다."
