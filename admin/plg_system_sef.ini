PLG_SEF_DOMAIN_DESCRIPTION="사이트에 둘 이상의 도메인으로 접속할 수 있다면 여기에 선호하는(정규라고도 함) 도메인을 입력하세요. <br><strong>참고:</strong> https://example.com과 https://www.example.com은 서로 다른 도메인입니다."
PLG_SEF_DOMAIN_LABEL="사이트 도메인"
PLG_SEF_ENFORCESUFFIX_DESCRIPTION="사용하고 \"URL에 접미사 추가\"도 사용하면 접미사가 없는 URL은 올바른 URL로 리디렉션됩니다. 6.0 버전부터는 이것이 표준 동작이 되며 더 이상 옵션이 아닙니다."
PLG_SEF_ENFORCESUFFIX_LABEL="리디렉션으로 접미사 강제"
PLG_SEF_INDEXPHP_DESCRIPTION="이 옵션은 전체 환경 설정에서 'URL 재작성 사용'이 사용 설정된 경우 URL의 'index.php'를 더 엄격하게 처리합니다. URL에 'index.php'가 남아 있으면 제거하고, 'index.php'가 있는 들어오는 요청을 'index.php'가 없는 버전으로 리디렉션합니다."
PLG_SEF_INDEXPHP_LABEL="index.php 엄격 처리"
