PLG_SYSTEM_JOOA11Y="시스템 - Joomla 접근성 검사기"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="검사할 대상 영역"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="웹사이트의 특정 영역을 대상으로 하는 선택자를 하나 입력하세요. 기본 설정은 랜드마크 <strong>main</strong>입니다. 랜드마크 대신 클래스, 요소, ARIA 역할(예: #main-content, .main, [role='main'])을 사용할 수 있습니다. 전체 페이지를 검사하려면 <strong>body</strong>를 입력하세요."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="검사 끄기"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="키 이름으로 특정 검사를 끕니다. <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">검사 끄는 방법</a>을 알아보세요."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="영역 무시"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="콘텐츠 컨테이너 안의 특정 영역을 무시합니다. 클래스나 요소는 쉼표로 구분하세요 (예: #ignore, .ignore)."
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="추가 속성"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="사용자 지정을 위한 추가 속성을 전달합니다. <a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">추가 속성</a>을 추가하는 방법을 알아보세요."
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="가독성 대상 영역"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="가독성을 검사할 페이지의 랜드마크입니다. 기본 설정은 랜드마크 <strong>main</strong>입니다."
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="항상 표시"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="모든 페이지에서 접근성 검사기를 불러옵니다. 웹사이트를 개발할 때는 유용하지만 사이트를 운영할 때는 켜 두지 않아야 합니다."
PLG_SYSTEM_JOOA11Y_KEY="키"
PLG_SYSTEM_JOOA11Y_VALUE="값"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Joomla 접근성 검사기는 일반적인 접근성 및 사용성 문제를 시각적으로 강조합니다. 콘텐츠 작성자를 위한 이 플러그인은 오류나 경고를 식별하고 수정 방법을 안내합니다. 이 플러그인은 웹사이트에 대한 철저한 분석을 제공하지 않으며 웹사이트의 접근성을 자동으로 보장하지도 않는다는 점에 유의하세요. 사이트가 접근성 표준을 충족하도록 본질적으로 접근성이 좋은 템플릿을 선택하는 것이 중요합니다."
