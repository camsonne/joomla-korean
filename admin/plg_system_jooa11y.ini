PLG_SYSTEM_JOOA11Y="시스템 - Joomla 접근성 검사기"
PLG_SYSTEM_JOOA11Y_KEY="키"
PLG_SYSTEM_JOOA11Y_VALUE="값"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Joomla 접근성 검사기는 일반적인 접근성 및 사용성 문제를 시각적으로 강조합니다. 콘텐츠 작성자를 위한 이 플러그인은 오류나 경고를 식별하고 수정 방법을 안내합니다. 이 플러그인은 웹사이트에 대한 철저한 분석을 제공하지 않으며 웹사이트의 접근성을 자동으로 보장하지도 않는다는 점에 유의하세요. 사이트가 접근성 표준을 충족하도록 본질적으로 접근성이 좋은 템플릿을 선택하는 것이 중요합니다."
