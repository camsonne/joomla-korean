COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="메뉴"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_DESCRIPTION="<p>메뉴에서 관리자 관리 페이지에 접근할 수 있습니다. 각 섹션에는 콘텐츠, 메뉴, 사용자처럼 Joomla의 해당 부분을 관리하는 페이지 모음이 있습니다.</p><p>창 모양 아이콘은 해당 섹션의 개별 대시보드로 연결됩니다. 시스템 메뉴 자체도 대시보드로 연결됩니다.</p>"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_TITLE="대시보드 패널"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>대시보드는 아이콘을 통해 자주 사용하는 페이지에 빠르게 접근할 수 있게 해 줍니다.</p><p>각 대시보드 패널은 설정 아이콘 <span class=\"icon-cogs\" aria-hidden=\"true\"></span>으로 사용자 지정할 수 있는 관리자 모듈입니다.<br>이를 통해 사이트 대시보드를 원하는 용도에 맞게 구성할 수 있습니다.</p>"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="알림 패널"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_DESCRIPTION="<p>알림 패널에는 Joomla와 다른 확장 프로그램의 업데이트가 있을 때 표시됩니다. 처리되지 않은 개인정보 요청도 여기에 표시됩니다.</p>"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_TITLE="상단 바"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>상단 바에는 표시된 페이지의 제목이 있어 항상 현재 위치를 알 수 있습니다. 상단 바의 다른 항목은 선택적 모듈입니다.</p><p>보통 현재 Joomla 버전과 추가 가이드 투어에 대한 접근이 여기에 있습니다.</p><p>마지막 항목은 보통 사이트 프런트엔드로의 링크와, 계정을 관리하고 로그아웃할 수 있는 사용자 메뉴입니다.</p>"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_TITLE="도움말 및 정보"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_DESCRIPTION="<p>도움이 되는 많은 자료가 여기에 있으며 추가 자료, 문서, 지원, Joomla에 참여하는 방법에 대한 링크도 있습니다.</p>"
