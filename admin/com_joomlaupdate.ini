COM_JOOMLAUPDATE_UPDATE_FAILED_MAIL_BODY="이 이메일은 Joomla 프로젝트에서 보낸 것이 아닙니다. 회원님의 사이트에서 자동으로 보낸 것입니다.\n{SITENAME} - {URL} \n\n================================================================================\n업데이트 정보\n================================================================================\n사이트를 {OLDVERSION}에서 {NEWVERSION}(으)로 업데이트하지 못했습니다.\n추가 디버깅 정보는 로그 파일 '/administrator/logs/joomla_update.php'를 확인하세요.\n이 이메일은 회원님의 사이트에서 보낸 것입니다.\nJoomla 프로젝트가 회원님께 직접 연락하는 일은 없습니다.\n================================================================================\n이 이메일을 왜 받았나요?\n================================================================================\n이 이메일은 사이트를 구동하는 소프트웨어인 Joomla가 자동으로 보낸 것입니다.\n사이트에서 자동 업데이트를 사용 설정했고 해당 업데이트를 설치하려고 할 때 이 메시지가 발생합니다.\nJoomla가 무엇인지, 무엇을 해야 하는지 이해하지 못하더라도 Joomla 프로젝트에 문의하지 마세요.\nJoomla 프로젝트가 이 이메일을 보낸 것이 아니며 도움을 줄 수도 없습니다. 대신 사이트를 만들었거나 관리하는 사람에게 문의하세요.\n================================================================================\n누가 이 이메일을 보냈나요?\n================================================================================\n이 이메일은 회원님의 사이트인 {SITENAME}에서 보낸 것입니다"
COM_JOOMLAUPDATE_UPDATE_FAILED_MAIL_SUBJECT="Joomla 업데이트 실패 {SITENAME} – {URL}"
