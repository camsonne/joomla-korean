COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p>Joomla가 업데이트를 수행하는 <code>administrator/components/com_joomlaupdate/extract.php</code> 파일과 통신할 수 없습니다. 보통 다음 이유 중 하나로 발생합니다:</p><ul><li>사이트 루트에 있는 <code>.htaccess</code>나 <code>web.config</code> 같은 서버 설정 파일이 이 파일에 대한 접근을 막고 있습니다.</li><li>서버 설정이 이 파일에 대한 접근을 막고 있습니다.</li><li>이 파일의 소유권과 권한 때문에 서버가 이 파일에 접근할 수 없습니다.</li><li>사이트가 로드 밸런서나 CDN 뒤에 있는데 그 설정이 이 파일에 대한 접근을 허용하지 않거나 명령 전송을 막습니다.</li><li>파일에 접근할 수 있더라도 mod_security2 같은 서버 보호 기능이 명령 전송을 막고 있습니다.</li></ul><p>확실하지 않으면 호스팅 업체에 문의하세요.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p>Joomla 업데이트가 업데이트를 수행하는 <code>administrator/components/com_joomlaupdate/extract.php</code>와 올바르게 통신할 수 없습니다. 보통 다음 이유 중 하나로 발생합니다:</p><ul><li>업데이트 적용 지침이 담긴 <code>administrator/components/com_joomlaupdate/update.php</code> 파일을 권한 문제 등으로 만들 수 없었습니다.</li><li>권한 문제로 <code>extract.php</code> 스크립트가 위에서 언급한 파일을 읽을 수 없습니다.</li><li>보안을 위해 <code>extract.php</code>로 보내는 모든 요청에 포함되는 비밀번호가 브라우저, 네트워크 장비 또는 서버에 의해 손상되고 있습니다</li></ul><p>브라우저 확장 프로그램이 설치되지 않은 다른 브라우저로, 가능하면 다른 인터넷 업체에 연결된 다른 컴퓨터에서 시도해 보세요. 오류가 계속되면 호스팅 업체에 문의하는 것이 좋습니다.</p>"
