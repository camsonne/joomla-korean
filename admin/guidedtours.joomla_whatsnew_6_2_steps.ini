COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Joomla 6.2 전체 릴리스 노트</h3><p><a title=\"전체 릴리스 노트\" href=\"https://www.joomla.org/announcements/release-news/joomla-6-2-is-here.html\" target=\"_blank\" rel=\"noopener noreferrer\">joomla.org에서 전체 릴리스 노트 보기</a></p><hr><h3>도움말 및 정보</h3><p class=\"mb-3\">도움이 되는 많은 자료가 여기에 있으며 추가 자료, 문서, 지원, Joomla에 참여하는 방법에 대한 링크도 있습니다.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"새 도움말 색인\" width=\"450\" height=\"275\"></p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_TITLE="추가 정보 및 도움말"
