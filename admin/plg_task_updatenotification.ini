PLG_TASK_UPDATENOTIFICATION="작업 - Joomla 업데이트 알림"
PLG_TASK_UPDATENOTIFICATION_END="업데이트 알림 종료"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="업데이트 알림 이메일을 받을 이메일 주소를 쉼표로 구분한 목록입니다. 목록의 주소는 슈퍼 유저 권한이 있는 사이트의 기존 사용자의 것이어야 합니다. 나열된 이메일 중 슈퍼 유저의 것이 없거나 비워 두면 이 사이트의 모든 슈퍼 유저가 업데이트 알림 이메일을 받습니다."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="슈퍼 유저 이메일"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla 업데이트 알림"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="이 작업은 새 Joomla 버전이 있는지 주기적으로 확인합니다. 발견되면 업데이트를 알리는 이메일을 보냅니다. 이메일은 <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">시스템 &rarr; 메일 템플릿</a>에서 사용자 지정할 수 있습니다."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="업데이트 알림 이메일에 사용할 언어를 선택하세요. 자동으로 설정하면 그때의 사이트 언어로 보냅니다."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="이메일 언어"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="자동"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="이 이메일은 Joomla 프로젝트에서 보낸 것이 아닙니다. 회원님의 사이트에서 자동으로 보낸 것입니다.\n{SITENAME} - {URL} \n\n================================================================================\n업데이트 정보\n================================================================================\n\n사이트에서 Joomla의 업데이트 버전이 있다는 것을 발견했습니다.\n\n현재 설치된 Joomla 버전: {CURVERSION}\n설치할 수 있는 Joomla 버전: {NEWVERSION}\n\n이 이메일은 이 사실을 알려 드리기 위해 회원님의 사이트에서 보낸 것입니다.\nJoomla 프로젝트가 사이트의 Joomla 업데이트에 대해 회원님께 직접 연락하는 일은 없습니다.\n\n================================================================================\n업데이트 방법\n================================================================================\n\n{SITENAME}에 업데이트를 설치하려면 다음 링크를 선택하세요. (URL이 링크가 아니면 브라우저에 복사하여 붙여 넣으세요).\n\n업데이트 링크: {LINK}\n\n릴리스 뉴스는 여기에서 확인할 수 있습니다: {RELEASENEWS}\n\n================================================================================\n이 이메일을 왜 받았나요?\n================================================================================\n\n이 이메일은 사이트를 구동하는 소프트웨어인 Joomla가 제공하는 플러그인이 자동으로 보낸 것입니다.\n이 플러그인은 Joomla의 업데이트 버전을 찾아 관리자에게 이메일 알림을 보냅니다.\n소프트웨어를 업데이트하거나 이 이메일을 사용 중지하기 전까지 사이트에서 비슷한 이메일을 여러 번 받게 됩니다.\n\n이 이메일을 사용 중지하려면 사이트의 플러그인 관리자에서 '작업 - Joomla 업데이트 알림' 플러그인의 게시를 중지하세요.\n\nJoomla가 무엇인지, 무엇을 해야 하는지 이해하지 못하더라도 Joomla 프로젝트에 문의하지 마세요.\nJoomla 프로젝트가 이 이메일을 보낸 것이 아니며 도움을 줄 수도 없습니다. 대신 사이트를 만들었거나 관리하는 사람에게 문의하세요.\n\n웹사이트를 만들었거나 관리하는 사람이라면, 사이트에 Joomla를 설치하거나 업데이트할 때 이 플러그인이 자동으로 활성화되었을 수 있다는 점에 유의하세요.\n\n================================================================================\n누가 이 이메일을 보냈나요?\n================================================================================\n\n이 이메일은 회원님의 사이트인 {SITENAME}에서 보낸 것입니다"
PLG_TASK_UPDATENOTIFICATION_EMAIL_SUBJECT="{SITENAME}에 Joomla 업데이트가 있습니다 – {URL}"
