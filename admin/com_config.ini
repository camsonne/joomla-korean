JLIB_RULES_SETTING_NOTES_COM_CONFIG="설정을 변경하면 이 그룹과 모든 하위 그룹, 컴포넌트 및 콘텐츠에 적용됩니다. 참고:<br><em><strong>상속됨</strong></em>은 상위 그룹의 권한이 사용됨을 의미합니다.<br><em><strong>거부됨</strong></em>은 상위 그룹의 설정과 관계없이 편집 중인 그룹이 이 작업을 수행할 수 없음을 의미합니다.<br><em><strong>허용됨</strong></em>은 편집 중인 그룹이 이 작업을 수행할 수 있음을 의미합니다 (단, 상위 그룹과 충돌하는 경우에는 영향이 없으며, 충돌은 계산된 설정에서 <em><strong>허용 안 됨 (잠김)</strong></em>으로 표시됩니다).<br><em><strong>설정 안 됨</strong></em>은 전체 환경 설정의 공개 그룹에만 사용됩니다. 공개 그룹은 다른 모든 그룹의 상위입니다. 권한이 설정되지 않으면 거부로 처리되지만 하위 그룹, 컴포넌트, 카테고리 및 항목에서 변경할 수 있습니다."
