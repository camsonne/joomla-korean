PLG_CONTENT_FIELDS="콘텐츠 - 필드"
PLG_CONTENT_FIELDS_XML_DESCRIPTION="<p>이 플러그인으로 '버튼 - 필드' 플러그인으로 삽입했거나 구문 {field #}을(를) 에디터 영역에 직접 입력한 사용자 지정 필드를 표시할 수 있습니다.</p><p><strong>사용 가능한 구문:</strong></p><ul><li><code>{field 1}</code>은(는) ID가 1인 필드를 표시합니다</li><li><code>{field 1,foo}</code>은(는) 선택한 필드를 대체 레이아웃 'foo'로 표시합니다.</li><li><code>{fieldgroup 2}</code>은(는) ID가 2인 필드 그룹의 모든 필드를 표시합니다.</li></ul>"
