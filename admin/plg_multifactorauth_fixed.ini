PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE="<p class=\"alert alert-info\">코드 영역 위아래에 표시되는 메시지는 언어 문자열 <code>PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE</code>와 <code>PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE</code>를 오버라이드하여 사용자 지정할 수 있습니다.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE="<p>Joomla용 다단계 인증 시연 플러그인입니다. 이 사용자에 대해 다단계 인증을 사용 설정할 때 설정한 고정 코드를 입력해야 합니다. 사실상 두 번째 비밀번호처럼 작동합니다.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE="<p class=\"alert alert-info\">설정 영역 위아래에 표시되는 메시지는 언어 문자열 <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE</code>와 <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE</code>를 오버라이드하여 사용자 지정할 수 있습니다</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE="<p>아래에 고정 코드를 입력하세요. 로그인한 후 사이트를 사용하기 전에 이 고정 코드를 입력해야 합니다.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SHORTINFO="원하는 코드를 직접 정하세요. <strong>시연 목적으로만 사용하세요</strong>."
PLG_MULTIFACTORAUTH_FIXED_XML_DESCRIPTION="고정 코드(&ldquo;두 번째 비밀번호&rdquo;)를 사용하는 다단계 인증 시연용 플러그인입니다. <strong>보안되지 않으므로 운영 사이트에서 사용하지 마세요.</strong> 이 플러그인은 자체 플러그인을 만들려는 개발자를 위한 예제로만 사용해야 합니다."
