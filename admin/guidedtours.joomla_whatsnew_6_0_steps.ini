COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">더 많은 업데이트</h2><p>추천 글이 이제 글 관리자 보기를 공유합니다.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>놓치셨다면</h3><p>Joomla 6은 더 나은 보안과 성능을 위해 The Update Framework(TUF)를 사용한 자동 업데이트를 지원합니다.<br>자동 업데이트 설정은 <em>Joomla 업데이트</em> 설정 섹션에서 찾을 수 있습니다.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>기타 개선 및 수정 사항</h3><ul class=\"mb-3\"><li>관리자 가입 승인에 대한 알림 이메일 <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>TinyMCE 이미지 대화 상자의 클래스 드롭다운에 사용자 지정 클래스 추가 <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>태그를 일괄 제거하는 기능 추가 <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>그 밖에도 눈에 보이지 않는 수많은 개선 사항...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="기타 기능"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>Joomla 6.0 릴리스 정보</h3><p><a title=\"릴리스 정보\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">6.joomla.org에서 릴리스 정보 보기</a></p><hr><h3>도움말 및 정보</h3><p>도움이 되는 많은 자료가 여기에 있으며 추가 자료, 문서, 지원, Joomla에 참여하는 방법에 대한 링크도 있습니다.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="추가 정보 및 도움말"
