COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_ACTION="로드 밸런서 뒤 설정 사용"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>로드 밸런서와 리버스 프록시 뒤에서 호스팅되는 Joomla 사이트를 위해 Joomla 3.9.26에서 새로운 전체 환경 설정 항목이 도입되었습니다.</p><p>이 설정을 사용하면 로드 밸런서/리버스 프록시가 방문자의 실제 IP 주소를 제공할 수 있습니다. 이 IP는 작업 로그와 글 투표 추적(해당 기능을 사용하는 경우)에 사용됩니다.</p><p><strong>로드 밸런서/리버스 프록시 뒤에 있는 사이트에서만 이 기능을 사용 설정하면 됩니다.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="새 서버 설정 \"로드 밸런서 뒤\""
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>3.9.22 이전에는 기본 htaccess.txt 파일에 디렉터리 목록 표시를 비활성화하기 위한 잘못된 코드가 들어 있었습니다. 이 파일은 자동으로 업데이트할 수 없으므로 보안팀은 기존 .htaccess 파일에 필요한 변경 사항을 직접 적용할 것을 권장합니다.</p><p>이전 코드:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>새 코드:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE="디렉터리 목록 관련 .htaccess 업데이트"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>5.1.0 이전에는 기본 htaccess.txt가 Brotli 압축을 지원하지 않았습니다. Brotli 압축을 사용하는 서버에 Joomla를 설치하면 이중 압축 오류가 발생할 수 있습니다. 이 파일은 자동으로 업데이트할 수 없으므로 기존 .htaccess 파일에 필요한 변경 사항을 직접 적용해야 합니다.</p><p>이전 코드:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>새 코드:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE="Brotli 압축 관련 .htaccess 업데이트"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>4.2.9 이전에는 기본 htaccess.txt 파일에 \"Content-Encoding\" HTTP 헤더를 추가하는 잘못된 코드가 들어 있었습니다. Joomla가 하위 디렉터리에 설치되어 있고 해당 디렉터리와 상위 디렉터리에 모두 이 코드가 있는 .htaccess 파일이 있으면 이중 인코딩 오류가 발생할 수 있습니다. 이 파일은 자동으로 업데이트할 수 없으므로 기존 .htaccess 파일에 필요한 변경 사항을 직접 적용해야 합니다.</p><p>이전 코드:</p><pre>Header append Content-Encoding gzip</pre><p>새 코드:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE="Content-Encoding 헤더 설정 관련 .htaccess 업데이트"
