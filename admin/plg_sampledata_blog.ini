PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_INTROTEXT="<p>사이트 작업을 위한 몇 가지 기본 팁입니다.</p><ul><li>Joomla에는 지금 보고 있는 '프런트엔드'와 메뉴를 설정하고 표시할 모듈을 정하는 등 사이트를 만드는 고급 작업을 하는 '관리자' 또는 '백엔드'가 있습니다. 사이트의 이 부분에 로그인할 때 사용한 것과 같은 사용자 이름과 비밀번호로 관리자에 별도로 로그인해야 합니다.</li><li>가장 먼저 하고 싶은 일은 아마 사이트 제목과 태그라인을 변경하고 로고를 추가하는 것입니다. 로그인하면 보이는 메뉴의 템플릿 설정 링크를 선택하세요. 사이트 설명, 브라우저 제목, 기본 이메일 및 기타 항목을 변경하려면 사이트 설정을 선택하세요. 관리자에서 더 고급 설정 옵션을 사용할 수 있습니다.</li><li>사이트의 모양을 완전히 바꾸려면 새 템플릿을 설치하는 것이 좋습니다. 시스템에서 목록의 설치 - 확장 프로그램을 선택하면 확장 프로그램 설치 관리자가 열립니다. Joomla에는 무료 및 상용 템플릿이 많이 있습니다.</li><li>이미 보셨듯이 사이트의 여러 부분을 볼 수 있는 사람을 제어할 수 있습니다. 모듈과 글을 작업할 때 접근 레벨을 등록 사용자로 설정하면 로그인한 사용자만 볼 수 있습니다.</li><li>새 글이나 다른 종류의 콘텐츠를 만들 때 게시 또는 게시 안 됨으로 저장할 수도 있습니다. 게시 안 됨이면 사이트 방문자는 볼 수 없지만 회원님은 볼 수 있습니다.</li><li>Joomla 사용에 대해 더 많은 것을 <a href=\"https://guide.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 문서 사이트</a>에서 배우고 <a href=\"https://forum.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 포럼</a>에서 다른 사용자의 도움을 받을 수 있습니다. 관리자의 모든 페이지에는 해당 페이지의 기능에 대한 자세한 정보를 제공하는 도움말 버튼이 있습니다.</li></ul>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_TITLE="사이트 작업하기"
