PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROIMAGE_ALT="놀라운 안드로메다 은하"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p>샘플 블로그 게시물입니다.</p><p>사이트에 로그인하면(관리자 로그인 링크는 이 페이지 맨 아래에 있습니다) 이 글과 기존의 다른 모든 글을 편집할 수 있습니다. 새 글을 만들고 사이트의 다른 변경도 할 수 있습니다.</p><p>글을 추가하고 수정하면서 사이트가 어떻게 바뀌는지, 그리고 다양한 방식으로 사이트를 사용자 지정할 수 있는지 확인해 보세요.</p><p>마음껏 해 보세요. 망가뜨릴 수 없습니다.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="블로그에 오신 것을 환영합니다"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FIELD_0="Uurnip greens yarrow ricebean endive cauliflower sea lettuce kohlrabi amaranth water spinach avocado daikon napa cabbage asparagus winter purslane kale."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>전체 페이지에서는 소개 콘텐츠와 글의 나머지 부분이 모두 표시됩니다. 원한다면 설정을 변경하여 소개를 숨길 수 있습니다.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p>홈페이지는 블로그 카테고리의 최근 글 네 개를 한 열로 표시하도록 설정되어 있습니다. 그 다음에는 그다음으로 오래된 글 두 개로의 링크가 있습니다. 사이트 관리자의 블로그 탭에 있는 콘텐츠 옵션 설정을 편집하여 이 숫자를 변경할 수 있습니다. 로그인한 경우 사이트 관리자로의 링크가 있습니다.</p><p>블로그 게시물을 소개와 전체 길이의 별도 페이지로 나누려면 더 보기 구간을 사용하여 구분선을 삽입하세요.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="홈페이지에 대하여"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXTIMAGE_ALT="게 성운"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p>사이트에는 자주 사용하는 모듈이 이미 미리 설정되어 있습니다. 다음이 포함됩니다:</p><ul><li>이미지(유형: 사용자 지정) - 메뉴 아래의 이미지를 담고 있습니다. 이미지를 변경하려면 편집할 수 있는 사용자 지정 모듈입니다.</li><li>인기 태그(유형: 태그 - 인기) - 글에 태그를 사용하면 표시됩니다. 편집할 때 태그 필드에 태그를 입력하세요.</li><li>이전 게시물(유형: 글) - 카테고리별로 글을 나열합니다.</li><li>신디케이션(유형: 신디케이션 피드) - 독자가 뉴스 리더로 게시물을 읽을 수 있게 합니다.</li><li>로그인 양식(유형: 로그인) - 사용자가 웹사이트의 제한된 영역에 접근할 수 있게 합니다.</li></ul><p>이 모듈에는 사이트 관리자의 모듈 관리자에서 실험해 볼 수 있는 많은 옵션이 있습니다. 로그인하면 오른쪽 위 모서리의 편집 아이콘을 선택하여 해당 모듈의 편집 화면으로 이동할 수도 있습니다. 편집한 모듈은 항상 저장하고 닫으세요.</p><p>Joomla에는 사이트에 포함할 수 있는 다른 많은 모듈도 있습니다. 사이트를 개발하면서 <a href=\"https://extensions.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 확장 프로그램 디렉터리</a>에서 더 많은 모듈을 찾아 추가할 수 있습니다.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="내 모듈"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p>템플릿은 웹사이트의 모양과 느낌을 제어합니다.</p><p>이 블로그는 Cassiopeia 템플릿으로 설치되어 있습니다.</p><p>로그인하면 보이는 메뉴의 사이트 작업하기, 템플릿 설정 링크를 선택하여 옵션을 편집할 수 있습니다.</p><p>예를 들어 사이트 배경색, 강조색, 사이트 제목, 사이트 설명, 제목 글꼴을 변경할 수 있습니다.</p><p>사이트 관리자에서 더 많은 옵션을 사용할 수 있습니다. 확장 프로그램 관리자로 새 템플릿을 설치할 수도 있습니다.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="내 템플릿"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_FULLTEXT="<p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est</p>"
