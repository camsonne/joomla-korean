PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p>워크플로는 글이 게시될 때까지 거쳐야 하는 단계를 관리합니다.</p><p>워크플로를 관리하는 컴포넌트는 기본적으로 사용 설정되어 있지 않습니다.</p><p>샘플 데이터와 함께 제공한 워크플로를 보려면 먼저 이 기능을 사용 설정해야 합니다.</p><ol><li>관리 영역에 접근합니다</li><li>'콘텐츠' > '글' > '옵션' > '통합' 탭에서 '워크플로 사용'을 '예'로 설정합니다</li><li>변경 사항을 저장합니다</li></ol><p>이제 '콘텐츠'에 다시 접근하면 '워크플로' 섹션이 보입니다.</p><p>글을 편집할 때 워크플로와 관련된 글의 새 전환도 보입니다.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_TITLE="워크플로"
