COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.2에 오신 것을 환영합니다!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">코어 업데이트</h2><div class=\"col-12 mb-3\"><h3>콘텐츠 편집 개선</h3><ul><li><strong>미디어 관리자/더 보기 통합</strong>: 이제 Joomla 미디어 관리자를 여는 개선된 선택기로 이미지와 미디어를 더 쉽게 추가할 수 있고, 새 더 보기 버튼으로 글 구분선을 더 빠르게 삽입할 수 있습니다.</li><li><strong>이미지와 그림 클래스 분리</strong>: 글의 소개/전체 텍스트 이미지에 이미지와 이를 둘러싼 figure 요소를 위한 독립적인 CSS 클래스 필드가 생겼습니다.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"하위 레벨 메뉴\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>프런트엔드 템플릿 (Cassiopeia)</h3><ul><li><strong>다단계 드롭다운 메뉴</strong>: 이제 Cassiopeia 메뉴가 드롭다운/접이식 레이아웃에서 하위 레벨을 두 개 이상 지원합니다.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>모듈 및 사이트 설정</h3><ul class=\"mb-3\"><li><strong>mod_login 링크 전환</strong>: 새 옵션으로 관리자가 템플릿 오버라이드 없이 “비밀번호를 잊으셨나요?”와 “사용자 이름을 잊으셨나요?” 링크를 숨길 수 있습니다. 기본값은 표시이므로 기존 사이트에는 영향이 없습니다.</li><li><strong>확장 프로그램 업데이트 보안 플래그</strong>: 개발자가 릴리스를 보안 업데이트(심각도 없음~심각)로 표시할 수 있으며, 표시된 업데이트는 시스템 -&gt; 업데이트 -&gt; 확장 프로그램과 대시보드 퀵 아이콘에서 강조됩니다.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"확장 프로그램의 보안 태그\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Joomla 6.2의 새로운 기능!"
