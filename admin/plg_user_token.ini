PLG_USER_TOKEN="사용자 - Joomla API 토큰"
PLG_USER_TOKEN_COPY="복사"
PLG_USER_TOKEN_COPY_DESC="토큰을 클립보드에 복사"
PLG_USER_TOKEN_COPY_FAIL="토큰을 복사하지 못했습니다."
PLG_USER_TOKEN_COPY_SUCCESS="토큰이 복사되었습니다."
PLG_USER_TOKEN_ENABLED_DESC="아니요로 설정하면 이 토큰으로 사이트에 접근하는 것을 일시적으로 막습니다."
PLG_USER_TOKEN_ENABLED_LABEL="활성"
PLG_USER_TOKEN_GROUP_DESC="Joomla API 애플리케이션 인증(사이트 원격 접근)에 사용되는 보안 토큰을 관리합니다. 이것이 무엇인지 잘 모르겠다면 필요하지 않을 가능성이 높으므로 이 설정을 무시해도 됩니다."
PLG_USER_TOKEN_GROUP_LABEL="Joomla API 토큰"
PLG_USER_TOKEN_NOTOKENFOROTHERPEOPLE_DESC="본인 이외의 사용자의 토큰은 볼 수 없습니다. 토큰이 권한 없는 사람에게 유출된 것으로 의심되는 경우 등에는 그들의 토큰을 사용 설정, 사용 중지 또는 재설정할 수 있습니다."
PLG_USER_TOKEN_RESET_DESC="예로 설정하고 사용자 프로필을 저장하면 이전 토큰을 대체하는 새 토큰이 만들어집니다."
PLG_USER_TOKEN_RESET_LABEL="초기화"
PLG_USER_TOKEN_SAVEME_DESC="아직 토큰이 없습니다. 사용자 프로필을 저장하여 토큰을 생성하세요. 이 페이지로 돌아와 토큰을 보고 관리할 수 있습니다."
PLG_USER_TOKEN_SAVEMEFOROTHERPEOPLE_DESC="이 사용자에게는 아직 토큰이 없습니다. 프로필을 저장하면 새 토큰이 생성되지만 보안상의 이유로 볼 수는 없습니다. 토큰을 사용 설정, 사용 중지 또는 재설정할 수는 있습니다."
PLG_USER_TOKEN_TOKEN_DESC="회원님의 토큰입니다. Joomla API 애플리케이션을 통해 사이트에 원격 접근이 필요한 서드파티 애플리케이션에서 사용하세요."
PLG_USER_TOKEN_TOKEN_LABEL="토큰"
PLG_USER_TOKEN_XML_DESCRIPTION="Joomla API 애플리케이션 인증(사이트 원격 접근)에 사용되는 보안 토큰을 관리할 수 있게 합니다. 이 토큰은 철저히 개인용입니다. 자신의 토큰은 볼 수 있지만 다른 사용자의 토큰은 사용 중지하거나 재설정만 할 수 있습니다."
