COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_DESCRIPTION="<h3>Joomla 6.1 전체 릴리스 노트</h3><p><a title=\"전체 릴리스 노트\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">joomla.org에서 전체 릴리스 노트 보기</a></p><hr><h3>도움말 및 정보</h3><p>도움이 되는 많은 자료가 여기에 있으며 추가 자료, 문서, 지원, Joomla에 참여하는 방법에 대한 링크도 있습니다.</p>"
