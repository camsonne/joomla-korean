COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla는 사용자 로그인을 보호하는 데 도움이 되도록 크게 개선된 <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">다단계 인증</a> 환경을 제공합니다.</p><p>이전 Joomla 버전의 2단계 인증 기능과 달리 사용자는 <em>더 이상 사용자 이름과 비밀번호와 함께 보안 코드를 입력하지 않아도 됩니다</em>. 다단계 인증은 사이트에 로그인한 후 별도의 단계에서 이루어집니다. 다단계 인증 확인을 완료하기 전에는 다른 페이지로 이동하거나 사이트를 사용할 수 없습니다. 이 덕분에 다단계 인증이 <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">피싱</a>에 강해집니다. 또한 패스키(Windows Hello, Apple TouchID / FaceID, Android 생체 인식 화면 잠금과의 통합 포함)나 이메일로 6자리 인증 코드를 보내는 방식 같은 대화형 확인 방법도 사용할 수 있습니다. 이 두 가지 대화형 방법은 이제 Joomla에 포함된 플러그인으로 제공됩니다.</p>"
