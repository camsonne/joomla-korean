COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.1에 오신 것을 환영합니다!</h1><p>Joomla 6.1은 사이트 구축을 더 쉽고, 안전하고, 유연하게 만드는 핵심 개선 사항을 도입했습니다. 이 투어는 핵심 내용을 한눈에 보여 줍니다.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">작업 증명 캡차로 스팸 방지 기능이 돌아왔습니다</h2><p>계정이나 API가 필요 없고, 개인정보를 보호하며, 접근성이 좋은 이 캡차는 방문자에게 보이지 않게 백그라운드에서 조용히 수학 퍼즐을 풉니다.</p><p>사용 설정하려면 <em>확장 프로그램</em> -&gt; <em>플러그인</em>으로 이동하여 <strong>captcha</strong>를 검색하고 사용 설정한 후 전체 환경 설정에서 기본값으로 지정하세요.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"확인 중과 확인됨 상태를 표시하는 캡차\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"기본 워크플로의 그래픽 표현\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">시각적 워크플로 에디터로 콘텐츠 파이프라인을 한눈에</h2><p>전체 게시 과정을 볼 수 있는 새로운 대화형 워크플로 다이어그램으로 콘텐츠 워크플로를 더 쉽게 관리하세요.</p><p><em>글 관리자</em> -&gt; <em>워크플로</em>에서 워크플로를 사용 설정하고 그래프 버튼을 찾아보세요.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">세 가지 새로운 미디어 사용자 지정 필드 옵션: 오디오, 비디오, 문서</h2><p>콘텐츠의 사용자 지정 필드를 만들 때 이제 콘텐츠 작성자가 이미지뿐 아니라 모든 유형의 미디어를 포함할 수 있습니다.</p><p>미디어는 HTML5 &lt;audio&gt;, &lt;video&gt; 또는 문서 링크(PDF, 스프레드시트 등)로 렌더링됩니다.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"오디오, 비디오, 문서의 세 가지 미디어 필드 옵션\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">버전 관리와 다국어 연결을 지원하는 더 똑똑한 모듈</h2><p>Joomla에는 오래전부터 글의 버전 기록이 있었습니다. 이제 같은 기능이 모듈에도 확장되었습니다.<br>다국어 웹사이트를 운영한다면 글을 언어 간에 연결하는 것처럼 모듈 인스턴스도 여러 언어에 걸쳐 연결할 수 있습니다.</p><h2>그 밖의 주목할 만한 개선 사항</h2><ul class=\"mb-3\"><li>TinyMCE 서식 있는 텍스트 에디터의 약어 <strong>&lt;abbr&gt;</strong> 지원으로 의미상 올바르고 접근성이 향상되었습니다 (콘텐츠를 편집할 때 TinyMCE 도구 모음에서 새 약어 버튼을 찾아보세요).</li><li>언어 오버라이드 상태 및 누락된 오버라이드 빠른 생성 UX 개선 (상태 표시기, 오버라이드를 쉽게 편집).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Joomla 6.1의 새로운 기능!"
