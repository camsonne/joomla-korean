PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>선택적인 목차가 있는 페이지로 나뉜 글을 만들 수 있습니다.</p><p>보통 WYSIWYG 에디터 도구 모음에 있는 페이지 나누기 버튼으로 페이지 나누기를 삽입하세요. 글에서 페이지 나누기 위치는 에디터에서 간단한 가로선으로 표시됩니다.</p><p>표시되는 텍스트는 선택한 옵션에 따라 제목, 대체 텍스트(제공된 경우) 또는 페이지 번호가 될 수 있습니다.</p><p>HTML 사용법:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; /&gt; 또는 <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; /&gt; 또는 <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; alt=&quot;The first page&quot; /&gt; 또는 <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; title=&quot;The page title&quot; /&gt;</p>"
