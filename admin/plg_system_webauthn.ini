PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="검증 가능한 암호화 서명이 있는 패스키만 패스키 로그인에 사용할 수 있도록 허용합니다. 보안이 높은 환경에서 강력히 권장합니다. PHP가 쓸 수 있는 시스템 임시 디렉터리와 OpenSSL 확장이 필요합니다. 인증되지 않은 일부 저렴한 패스키는 아예 작동하지 않을 수 있습니다. 이 옵션을 사용 중지하면 Joomla가 사용 중인 패스키의 제조사와 모델을 식별할 수 없게 됩니다 (패스키 이름 옆에 아이콘이 표시되지 않습니다)."
