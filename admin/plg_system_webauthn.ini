PLG_SYSTEM_WEBAUTHN="시스템 - 패스키(비밀번호 없는) 로그인"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="사용자를 대신하여 패스키를 추가하거나 제거할 수 없습니다. 사용자가 직접 로그인하여 자신의 기기를 설정해야 합니다."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="패스키를 사용한 비밀번호 없는 인증을 사용 설정합니다. 사용자 프로필 편집기의 패스키 탭과 패스키 로그인 버튼은 사용자가 HTTPS로 사이트에 접속한 경우에만 표시됩니다. 패스키 등록과 이를 이용한 로그인은 사이트가 사용자 브라우저가 신뢰하는 인증 기관이 서명한 유효한 인증서를 사용하는 경우에만 작동합니다."
