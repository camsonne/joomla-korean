COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla는 이제 기본 htaccess.txt와 web.config.txt 파일에 추가 보안 강화 기능이 포함되어 있습니다. 이 기능은 웹 브라우저의 MIME 유형 스니핑 기능을 비활성화합니다. 스니핑은 일반적으로 무해한 파일 형식(예: 이미지)에 있는 스크립트가 실행되어 교차 사이트 스크립팅 취약점으로 이어지는 특정 공격 경로를 만듭니다.</p><p>보안팀은 이러한 파일을 자동으로 업데이트할 수 없으므로 기존 .htaccess 또는 web.config 파일에 필요한 변경 사항을 직접 적용할 것을 권장합니다.</p><p><strong>.htaccess 변경 사항</strong><br>\"## Mod_rewrite in use.\" 앞에 다음 줄을 추가하세요:</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>web.config 변경 사항</strong><br>\"&lt;/rewrite&gt;\" 바로 뒤에 다음 줄을 추가하세요:</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>"
COM_CPANEL_MSG_ADDNOSNIFF_TITLE=".htaccess 및 web.config 보안 업데이트"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>3.9.21부터 Joomla는 기본 htaccess.txt에 추가 보안 규칙을 포함합니다. 이 규칙은 svg 파일 사용자를 잠재적인 교차 사이트 스크립팅(XSS) 취약점으로부터 보호합니다.<br>보안팀은 이 파일을 자동으로 업데이트할 수 없으므로 기존 .htaccess 파일에 필요한 변경 사항을 직접 적용할 것을 권장합니다.</p><p><strong>.htaccess 변경 사항</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>현재 IIS 웹 서버에서 이를 조건부로 설정하는 방법은 알려져 있지 않습니다. 추가 지원은 호스팅 업체에 문의하세요.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="SVG 파일 사용에 대한 추가 XSS 보호"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Joomla 3.4.0부터 웹사이트의 시스템 - 언어 필터 플러그인에 문제가 있을 수 있습니다. 해결하려면 <a href=\"index.php?option=com_languages&view=languages\">언어 관리자</a>를 열고 각 콘텐츠 언어를 직접 저장하여 접근 레벨이 저장되도록 하세요."
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="다국어 설정에 문제가 있을 수 있습니다"
COM_CPANEL_MSG_ROBOTS_BODY="Joomla 3.3에서 SEO를 개선하기 위해 Google이 템플릿과 미디어 파일에 기본으로 접근할 수 있도록 기본 robots.txt 파일이 변경되었습니다. 이 변경 사항은 업그레이드할 때 자동으로 적용되지 않으므로 robots.txt.dist 파일의 변경 사항을 검토하고 직접 만든 robots.txt 파일에 적용하는 것이 좋습니다."
COM_CPANEL_MSG_ROBOTS_TITLE="robots.txt 업데이트"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Joomla 3.5부터 통계 플러그인이 Joomla 프로젝트에 익명 데이터를 전송합니다. Joomla 버전, PHP 버전, 데이터베이스 엔진과 버전, 서버 운영 체제만 전송됩니다.</p><p>이 데이터는 향후 Joomla 버전이 많은 사용자에게 영향을 주지 않고 최신 데이터베이스와 PHP 기능을 활용할 수 있도록 수집됩니다. Joomla 3.3에서 더 안전한 Bcrypt 비밀번호를 구현하면서 최소 PHP 5.3.10이 필요해졌을 때 그 필요성이 분명해졌습니다.</p><p>완전한 투명성과 개발자를 돕기 위해 <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">이 데이터는 공개되어 있습니다.</a> API와 그래프에서 사용 중인 Joomla 버전, PHP 버전, 데이터베이스 엔진을 확인할 수 있습니다.</p><p>Joomla 프로젝트에 이 정보를 제공하고 싶지 않다면 시스템 - Joomla 통계 플러그인을 사용 중지할 수 있습니다.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Joomla의 통계 수집"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>보안팀의 검토 과정에서 새 Joomla 설치의 전체 텍스트 필터 기본 설정을 일부 변경했습니다. '공개', '손님', '등록 사용자' 그룹의 기본 설정이 이제 'HTML 없음'입니다. 이 변경은 새 설치에만 적용되므로 변경 사항을 검토하고 시스템 &rarr; 전체 환경 설정 &rarr; 텍스트 필터에서 사이트를 업데이트할 것을 강력히 권장합니다.</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="텍스트 필터 권장 사항 업데이트"
