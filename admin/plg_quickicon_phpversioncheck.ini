PLG_QUICKICON_PHPVERSIONCHECK="퀵 아이콘 - PHP 버전 확인"
PLG_QUICKICON_PHPVERSIONCHECK_SECURITY_ONLY="사용 중인 PHP 버전 %1$s은(는) 현재 PHP 프로젝트에서 보안 수정만 제공하고 있습니다. 곧 PHP 버전의 지원이 종료된다는 뜻입니다. %2$s에 지원이 종료되기 전에 더 새로운 PHP 버전으로 업그레이드하는 것을 계획하시기 바랍니다. 더 새로운 PHP 버전으로 업그레이드하면 Joomla가 더 빠르고 안전해집니다. 업그레이드 방법은 호스팅 업체에 문의하세요."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED="서버가 PHP %1$s을(를) 사용하고 있음을 감지했습니다. 이 버전은 오래되어 개발자의 공식 보안 업데이트를 더 이상 받지 않습니다. Joomla 프로젝트는 최소 %3$s까지 보안 업데이트를 받는 PHP %2$s 이상으로 사이트를 업그레이드할 것을 권장합니다. <br><br>호스팅 업체에 PHP %2$s 이상을 사이트의 기본 버전으로 설정해 달라고 요청하세요. 호스팅 업체가 이미 PHP %2$s을(를) 지원한다면 사이트 루트와 'administrator' 디렉터리에서 PHP %2$s을(를) 사용 설정하세요. 보통 호스팅 제어판의 도구로 직접 할 수 있지만 확실하지 않으면 호스팅 업체에 문의하는 것이 좋습니다."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED_JOOMLA_OUTDATED="서버가 PHP %1$s을(를) 사용하고 있음을 감지했습니다. 이 버전은 오래되어 개발자의 공식 보안 업데이트를 더 이상 받지 않습니다. 또한 오래된 Joomla 버전을 사용하고 있으므로 더 새로운 PHP 버전을 권장할 수 없습니다. Joomla를 먼저 업데이트한 후 PHP 업그레이드 안내를 따르시기 바랍니다."
PLG_QUICKICON_PHPVERSIONCHECK_XML_DESCRIPTION="설치된 PHP 버전의 지원 상태를 확인하고 완전히 지원되지 않으면 경고를 표시합니다."
