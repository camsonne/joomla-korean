PLG_SYSTEM_SHORTCUT="시스템 - 키보드 단축키"
PLG_SYSTEM_SHORTCUT_XML_DESCRIPTION="<p>관리자 사이트에서 키보드 단축키를 사용 설정하며, 다른 플러그인이 제공할 수 있습니다. 다음 단축키가 기본으로 포함됩니다:</p><ul class=\"list-unstyled\"><li><kbd>J</kbd> <small>다음</small> <kbd>A</kbd> 저장</li><li><kbd>J</kbd> <small>다음</small> <kbd>S</kbd> 저장 후 닫기</li><li><kbd>J</kbd> <small>다음</small> <kbd>Q</kbd> 취소</li><li><kbd>J</kbd> <small>다음</small> <kbd>N</kbd> 새로 만들기</li><li><kbd>J</kbd> <small>다음</small> <kbd>F</kbd> 검색</li><li><kbd>J</kbd> <small>다음</small> <kbd>O</kbd> 옵션</li><li><kbd>J</kbd> <small>다음</small> <kbd>H</kbd> 도움말</li><li><kbd>J</kbd> <small>다음</small> <kbd>M</kbd> 메뉴 전환</li><li><kbd>J</kbd> <small>다음</small> <kbd>X</kbd> 개요</li><li><kbd>J</kbd> <small>다음</small> <kbd>D</kbd> 홈 대시보드</li></ul>"
