PLG_USER_TOKEN="사용자 - Joomla API 토큰"
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_DESC="Joomla API 애플리케이션에 인증하기 위해 Joomla 토큰을 사용할 수 있는 Joomla 사용자 그룹입니다. 사용자 프로필에서 Joomla 토큰 관리 인터페이스를 볼 수 있는 사용자 그룹도 제어합니다. 기본값: Joomla 기본 제공 슈퍼 유저 그룹 (사용자 그룹 ID 8)."
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_LABEL="허용된 사용자 그룹"
PLG_USER_TOKEN_XML_DESCRIPTION="Joomla API 애플리케이션 인증(사이트 원격 접근)에 사용되는 보안 토큰을 관리할 수 있게 합니다. 이 토큰은 철저히 개인용입니다. 자신의 토큰은 볼 수 있지만 다른 사용자의 토큰은 사용 중지하거나 재설정만 할 수 있습니다."
