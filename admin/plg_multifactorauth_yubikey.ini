PLG_MULTIFACTORAUTH_YUBIKEY="다단계 인증 - YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_CAPTIVE_PROMPT="아래 텍스트 상자를 클릭하세요. 그런 다음 YubiKey를 기기의 USB 포트에 꽂고 YubiKey 코드가 생성되도록 모델에 따라 금색 원판이나 금색 패드를 터치하세요. NFC를 지원하는 휴대폰이나 태블릿에서 NFC가 지원되는 YubiKey를 사용하는 경우에는 YubiKey를 휴대폰이나 태블릿의 NFC 리더 영역에 가까이 대세요."
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="YubiKey 코드"
PLG_MULTIFACTORAUTH_YUBIKEY_ERR_VALIDATIONFAILED="올바른 YubiKey 비밀 코드를 입력하지 않았거나 지금 YubiCloud 서버에 연결할 수 없습니다."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="이미 YubiKey를 설정했습니다 (<code>%s</code>로 시작하는 코드를 생성하는 키). 이 페이지에서는 제목만 변경할 수 있습니다."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="아래에 <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a>가 생성한 코드를 입력한 후 확인 버튼을 클릭하거나 터치하세요. YubiKey의 고유 식별 코드인 처음 열두 글자가 저장됩니다."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_LABEL="YubiKey 식별"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_PLACEHOLDER="YubiKey 코드 입력"
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="YubiKey 보안 하드웨어 토큰을 사용합니다."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="사이트 사용자가 YubiKey 보안 하드웨어 토큰으로 다단계 인증을 사용할 수 있게 합니다. 사용자는 <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>에서 구할 수 있는 자신의 YubiKey가 필요합니다. 다단계 인증을 사용하려면 사용자 프로필을 편집하여 다단계 인증을 사용 설정해야 합니다."
