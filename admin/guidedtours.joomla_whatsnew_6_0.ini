COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6에 오신 것을 환영합니다!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-6 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"하위 템플릿 스타일 사용자 지정 도구 표시\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-6 mb-3\"><h2 class=\"mb-3\">Cassiopeia 확장판</h2><p>글꼴과 색상 변경 같은 고급 사용자 지정 기능을 보여 주는 새 스타일의 하위 템플릿을 살펴보세요.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">확장된 버전 관리</h2><p>Joomla의 버전 관리 시스템이 사용자 지정 필드, 태그, 카테고리까지 포함하도록 개선되어 모든 콘텐츠 변경 사항을 추적, 비교, 복원할 수 있습니다.</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="Joomla 6의 새로운 기능!"
