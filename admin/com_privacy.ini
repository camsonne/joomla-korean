COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="네트워크 연결이 가능하면 Joomla 설치는 다음과 같은 다양한 기능을 위해 joomla.org 서버와 통신을 시도합니다:<ul><li>Joomla 애플리케이션 업데이트 확인</li><li>Joomla 코어 확장 프로그램의 도움말 화면</li><li>웹에서 설치 서비스 (선택 참여)</li><li>통계 수집 서버 (선택 참여)</li></ul>모든 HTTP 요청과 마찬가지로 서버의 IP 주소가 요청의 일부로 전송됩니다. Joomla가 서버에서 데이터를 처리하는 방식에 대한 자세한 내용은 <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">개인정보 처리방침</a>을 검토하세요."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Joomla의 로깅 시스템은 방문자의 IP 주소를 기록하여 로그 파일에 메시지를 씁니다. 이 로그 파일은 코어 업데이트, 잘못된 로그인 시도, 처리되지 않은 오류, 사용 중단된 API 사용 같은 개발 정보 등 Joomla 사이트의 다양한 활동을 기록하는 데 사용됩니다. 이 로그 파일의 형식은 로거를 설정하는 확장 프로그램에서 사용자 지정할 수 있으므로 `%s`에 있는 웹사이트의 로그 파일을 다운로드하여 검토하는 것이 좋습니다."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Joomla 웹사이트에 대한 모든 요청은 세션을 시작하여 세션 데이터에 IP 주소를 저장하고 사용자의 브라우저에 세션 쿠키를 만듭니다. IP 주소는 잠재적인 세션 하이재킹 공격으로부터 보호하는 보안 수단으로 사용되며, 세션이 만료되고 데이터가 삭제되면 이 정보도 삭제됩니다. 세션 쿠키의 이름은 무작위로 생성된 해시를 기반으로 하므로 일정한 식별자가 없습니다. 세션 쿠키는 세션이 만료되거나 사용자가 브라우저를 종료하면 폐기됩니다."
