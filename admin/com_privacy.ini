COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="이 화면의 정보는 개인정보 관련 기능을 이 시스템에 보고하는 확장 프로그램에서 수집됩니다. 사이트 소유자가 설치된 확장 프로그램의 기능을 파악하고 개인정보 처리방침 같은 사이트 정책을 만드는 데 도움이 되는 정보를 제공하기 위한 것입니다. 이 화면은 확장 프로그램이 보고 시스템을 지원해야 하며 사용 설정된 확장 프로그램의 정보만 표시하므로 전체 목록으로 간주해서는 안 되며, 자세한 내용은 각 확장 프로그램의 문서를 참조하는 것이 좋습니다."
