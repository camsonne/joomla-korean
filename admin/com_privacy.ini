COM_PRIVACY_POSTINSTALL_BODY="<p>EU 시민을 위한 GDPR과 세계 곳곳의 비슷한 규정이 도입됨에 따라 사용자의 <strong>개인 정보</strong>를 저장하기 전에 동의를 요청해야 할 수 있습니다.</p><p>Joomla 3.9는 사이트 개인정보 처리방침을 만들고 사용자 동의를 수집하는 데 도움이 되는 새로운 기능을 도입했습니다. 또한 사이트에서 개인 정보를 삭제해 달라는 요청 같은 사용자 정보 요청을 관리하는 워크플로도 제공합니다.</p><p>이 새로운 기능에 대한 자세한 내용은 <a href='https://guide.joomla.org/user-manual/privacy' target='_blank' rel='noopener noreferrer'>개인정보 문서</a>를 참조하세요.</p>"
