COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="{URL}의 관리자가 이 이메일 주소와 관련된 개인 정보를 내보내 달라는 요청을 만들었습니다. 보안을 위해 이 웹사이트에서의 개인 정보 요청이 맞는지 확인해야 합니다.\n\n실수로 요청된 경우 이 이메일을 무시하세요. 아무 일도 일어나지 않습니다.\n\n이 요청을 확인하려면 다음 중 하나를 수행하세요:\n\n1. 다음 URL에 접속합니다: {TOKENURL}\n\n2. 이 이메일에서 토큰을 복사하여 아래 URL에 접속한 후 양식에 토큰을 붙여 넣습니다.\nURL: {FORMURL}\n토큰: {TOKEN}\n\n이 토큰은 이메일이 전송된 시점부터 24시간 동안만 유효합니다."
COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_REMOVE_REQUEST="{URL}의 관리자가 이 이메일 주소와 관련된 모든 개인 정보를 삭제해 달라는 요청을 만들었습니다. 보안을 위해 이 웹사이트에서 개인 정보를 삭제하라는 요청이 맞는지 확인해야 합니다.\n\n실수로 요청된 경우 이 이메일을 무시하세요. 아무 일도 일어나지 않습니다.\n\n이 요청을 확인하려면 다음 중 하나를 수행하세요:\n\n1. 다음 URL에 접속합니다: {TOKENURL}\n\n2. 이 이메일에서 토큰을 복사하여 아래 URL에 접속한 후 양식에 토큰을 붙여 넣습니다.\nURL: {FORMURL}\n토큰: {TOKEN}\n\n이 토큰은 이메일이 전송된 시점부터 24시간 동안만 유효합니다."
