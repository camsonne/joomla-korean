PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="이 캡차 플러그인은 브라우저가 자동으로 풀 수 있는 수학 과제를 사용자의 브라우저에 제시합니다. 사용자가 사람임을 증명하려는 것이 아니라, 사용자가 과제를 푸는 데 필요한 시간을 투자할 의사가 있음을 증명하기 위한 것입니다. 현재 Altcha(altcha.org) 라이브러리를 기반으로 합니다."
