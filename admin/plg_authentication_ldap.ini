PLG_LDAP_FIELD_UID_DESC="사용자의 로그인 ID가 있는 LDAP 속성입니다. Active Directory에서는 sAMAccountName입니다."
PLG_LDAP_FIELD_UID_LABEL="매핑: 사용자 ID"
PLG_LDAP_FIELD_USERNAME_DESC="연결 사용자 이름과 연결 비밀번호는 DN 조회 단계의 연결 매개변수를 정의합니다. 익명 DN 조회(두 필드를 모두 비워 둠)와 관리 연결(연결 사용자 이름은 Administrator 같은 관리 계정의 사용자 이름) 두 가지 옵션이 있습니다. 바인딩 후 검색 방법에서만 사용됩니다."
PLG_LDAP_FIELD_USERNAME_LABEL="연결 사용자 이름"
PLG_LDAP_FIELD_USERSDN_DESC="[username] 키워드는 사용자가 입력한 로그인으로 동적으로 대체됩니다. 예: uid=[username], dc=my-domain, dc=com. 세미콜론으로 구분하여 여러 문자열을 사용할 수 있습니다. 사용자로 직접 바인딩 방법에서만 사용됩니다."
PLG_LDAP_FIELD_USERSDN_LABEL="사용자 DN"
