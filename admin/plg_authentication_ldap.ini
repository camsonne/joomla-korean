PLG_LDAP_FIELD_SEARCHSTRING_DESC="특정 사용자를 검색하는 데 사용하는 쿼리 문자열입니다. [search] 키워드는 사용자가 입력한 로그인으로 동적으로 대체됩니다. 예: uid=[search]. 세미콜론으로 구분하여 여러 문자열을 사용할 수 있습니다. 모든 방법에서 초기 바인딩 후에 사용됩니다."
