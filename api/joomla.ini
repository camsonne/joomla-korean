JGLOBAL_FILTER_TYPE_DESC="<p>1. 금지 목록은 나열된 태그와 속성을 제외한 모든 태그와 속성을 허용합니다.<br><strong>--</strong> 기본 금지 목록의 태그: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> 기본 금지 목록의 속성: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> 필터 태그와 필터 속성 필드에 쉼표로 구분하여 추가하면 태그와 속성을 더 금지할 수 있습니다.<br><strong>--</strong> 사용자 지정 금지 목록으로 기본 금지 목록을 덮어쓸 수 있습니다. 금지할 태그와 속성을 필터 태그와 필터 속성 필드에 추가하세요.</p><p>허용 목록은 필터 태그와 필터 속성 필드에 나열된 태그만 허용합니다.</p><p>HTML 없음은 콘텐츠를 저장할 때 모든 HTML 태그를 제거합니다.</p><p>이 설정은 사용 중인 에디터와 관계없이 적용됩니다. <br>WYSIWYG 에디터를 사용하더라도 필터링 설정에 따라 데이터베이스에 정보를 저장하기 전에 추가 태그와 속성이 제거될 수 있습니다.</p>"
